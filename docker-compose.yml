services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot-new
    restart: unless-stopped
    # 用 host 网络,让容器出口 IP = 宿主机 IP(跟 386du 项目一致,避免应用宝 API IP 白名单问题)
    network_mode: host
    volumes:
      - qq-farm-new-data:/app/core/data
      - qq-farm-new-logs:/app/core/data/logs
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3338
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3338/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-new-data:
    name: qq-farm-new-data
  qq-farm-new-logs:
    name: qq-farm-new-logs
